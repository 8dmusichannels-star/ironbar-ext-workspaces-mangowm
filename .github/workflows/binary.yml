name: Binary
on:
  workflow_run:
    workflows: [ Deploy ]
    types: [ completed ]
  release:
    types: [ created ]
  workflow_dispatch:
jobs:
  get_last_release:
    runs-on: ubuntu-latest
    outputs:
      latest_release_tag: ${{ steps.latest-release.outputs.LATEST_RELEASE_TAG }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract the latest release
        id: latest-release
        run: echo "LATEST_RELEASE_TAG=$(gh release view --json tagName -q .tagName)" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    name: Build
    runs-on: ${{matrix.platform.image}}
    container: ghcr.io/jakestanger/ironbar-build:master
    needs: get_last_release
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { image: ubuntu-latest, name: x86_64 }
          - { image: ubuntu-24.04-arm, name: arm64 }
    steps:
      - uses: actions/checkout@v4
        with:
